name: my_chat_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  device_info_plus: ^13.2.0
  riverpod_annotation: ^4.0.3
  flutter_riverpod: ^3.3.2
  equatable: ^2.0.5
  http: ^1.6.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_secure_storage: ^10.0.0
  socket_io_client: ^3.1.4
  intl: ^0.20.2
  gal: ^2.3.0
  image_picker: ^1.2.3
  file_picker: ^12.1.1
  just_audio: ^0.10.5
  flutter_sound: ^9.14.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.6
  url_launcher: ^6.2.5
  flutter_dotenv: ^6.0.1
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.0
  http_parser: ^4.1.2
  video_player: ^2.14.0
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.5.5
  overlay_support: ^2.1.0
  go_router: ^17.5.0
  collection: ^1.19.1
  crypto: ^3.0.7
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^4.0.4
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  record_linux: 1.1.0
  record_platform_interface: 1.3.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/ic_notification.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  
  assets:
    - .env